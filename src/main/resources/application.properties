# ── Server ───────────────────────────────────────────────
server.port=8080

# ── GitHub API ───────────────────────────────────────────
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_API_TOKEN}  
github.api.page-size=${GITHUB_API_PAGE_SIZE:100}

# ── Thread Pool ──────────────────────────────────────────
github.threadpool.core-size=${GITHUB_THREADPOOL_CORE_SIZE:10}
github.threadpool.max-size=${GITHUB_THREADPOOL_MAX_SIZE:20}
github.threadpool.queue-capacity=${GITHUB_THREADPOOL_QUEUE_CAPACITY:2000}
github.threadpool.thread-name-prefix=${GITHUB_THREADPOOL_THREAD_NAME_PREFIX:github-worker-}

# ── Cache ────────────────────────────────────────────────
github.cache.ttl-minutes=${GITHUB_CACHE_TTL_MINUTES:5}

# ── Swagger ──────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
